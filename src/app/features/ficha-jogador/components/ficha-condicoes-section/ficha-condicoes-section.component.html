<div class="collapse" id="collapseCondicoes">
  <div class="card shadow-sm mb-3">
    <div class="card-header bg-danger text-white">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fas fa-heart-broken me-2"></i>Condições</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-toggle="collapse"
          data-bs-target="#collapseCondicoes" title="Fechar"></button>
      </div>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4 col-sm-6">
          <div class="condition-box">
            <i class="fas fa-utensils text-warning"></i>
            <label>Fome</label>
            <input type="number" class="form-control" [(ngModel)]="jogador.fome" (change)="saveToCache.emit()">
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="condition-box">
            <i class="fas fa-tint text-info"></i>
            <label>Sede</label>
            <input type="number" class="form-control" [(ngModel)]="jogador.sede" (change)="saveToCache.emit()">
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="condition-box">
            <i class="fas fa-tired text-secondary"></i>
            <label>Cansaço</label>
            <input type="number" class="form-control" [(ngModel)]="jogador.cansaco" (change)="saveToCache.emit()">
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="condition-box">
            <i class="fas fa-sun text-danger"></i>
            <label>Calor</label>
            <input type="number" class="form-control" [(ngModel)]="jogador.calor" (change)="saveToCache.emit()">
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="condition-box">
            <i class="fas fa-snowflake text-primary"></i>
            <label>Frio</label>
            <input type="number" class="form-control" [(ngModel)]="jogador.frio" (change)="saveToCache.emit()">
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="condition-box">
            <i class="fas fa-bed text-dark"></i>
            <label>Sono</label>
            <input type="number" class="form-control" [(ngModel)]="jogador.sono" (change)="saveToCache.emit()">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
