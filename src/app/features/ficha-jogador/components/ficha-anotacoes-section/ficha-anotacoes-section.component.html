<div class="collapse" id="collapseAnotacoes">
  <div class="card shadow-sm mb-3">
    <div class="card-header bg-secondary text-white">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fas fa-sticky-note me-2"></i>Anotações</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-toggle="collapse"
          data-bs-target="#collapseAnotacoes" title="Fechar"></button>
      </div>
    </div>
    <div class="card-body">
      <textarea class="form-control" rows="10" [(ngModel)]="jogador.anotacoes" (change)="saveToCache.emit()"
        placeholder="Escreva aqui informações importantes: NPCs, locais, segredos, lembretes de sessão..."></textarea>
    </div>
  </div>
</div>
