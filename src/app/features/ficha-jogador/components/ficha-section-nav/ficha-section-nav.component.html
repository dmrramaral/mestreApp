<div class="row mb-4">
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="section-buttons">
          <button *ngIf="isDnd5e" class="btn btn-outline-primary" type="button" data-bs-toggle="collapse"
            data-bs-target="#">
            <i class="fas fa-magic me-2"></i>Magias
          </button>
         <button class="btn theme-outline-neutral" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseTracos">
            <i class="fas fa-scroll me-2"></i>Traços
          </button>
          <button class="btn btn-outline-warning" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseMochila">
            <i class="fas fa-backpack me-2"></i>Mochila
          </button>
          <button class="btn btn-outline-info" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseEquipamentos">
            <i class="fas fa-shield-alt me-2"></i>Equipamentos
          </button>
          <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapsePericias">
            <i class="fas fa-tasks me-2"></i>Perícias
          </button>
          <button class="btn btn-outline-danger" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseCondicoes">
            <i class="fas fa-heart-broken me-2"></i>Condições
          </button>
          <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseAnotacoes">
            <i class="fas fa-sticky-note me-2"></i>Anotações
          </button>
          <button class="btn btn-outline-success" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseTalentos">
            <i class="fas fa-star me-2"></i>Talentos
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
