<div class="collapse" id="collapseTracos">
  <div class="card shadow-sm mb-3">
    <div class="card-header bg-success text-white">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fas fa-star me-2"></i>Traços</h5>
        <div>
          <button *ngIf="isDnd5e" type="button" class="btn btn-light btn-sm me-2" (click)="abrirBuscarTracos.emit()">
            <i class="fas fa-search me-1"></i>Buscar API
          </button>
          <button type="button" class="btn btn-light btn-sm me-2" (click)="adicionarTracos()">
            <i class="fas fa-plus me-1"></i>Adicionar Manual
          </button>
          <button type="button" class="btn-close btn-close-white ms-1" data-bs-toggle="collapse"
            data-bs-target="#collapseTracos" title="Fechar"></button>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="row g-3 mb-3" *ngIf="adicionandoTracos">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Nome do traço" [(ngModel)]="novoTracos.nome">
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Descrição" [(ngModel)]="novoTracos.descricao">
        </div>
        <div class="col-md-2 d-flex gap-2 justify-content-end">
          <button type="button" class="btn btn-success btn-sm" (click)="confirmarAdicionarTracos()">
            <i class="fas fa-check"></i>
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelarAdicionarTracos()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <div class="talent-list" *ngIf="jogador?.tracos?.length > 0; else semTracos">
        <div class="talent-item" *ngFor="let tracos of jogador.tracos; let i = index">
          <div class="talent-header">
            <div>
              <i class="fas fa-star text-success"></i>
              <strong>{{ tracos.nome }}</strong>
            </div>
            <div>
              <button type="button" class="btn btn-sm btn-outline-primary" (click)="toggleEditarTracos(i)">
                <i class="fas" [class.fa-pen]="!editandoTracos[i]" [class.fa-save]="editandoTracos[i]"></i>
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="removerTracos(tracos)">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>

          <div *ngIf="!editandoTracos[i]">
            <p class="talent-description">{{ tracos.descricao }}</p>
          </div>

          <div *ngIf="editandoTracos[i]">
            <input type="text" class="form-control mb-2" [(ngModel)]="tracos.nome" placeholder="Nome do tracos">
            <textarea class="form-control" rows="3" [(ngModel)]="tracos.descricao" placeholder="Descrição"></textarea>
          </div>
        </div>
      </div>

      <ng-template #semTracos>
        <p class="text-muted mb-0">Nenhum tracos adicionado.</p>
      </ng-template>
    </div>
  </div>
</div>
